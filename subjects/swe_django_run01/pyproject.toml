[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djangoframework"
version = "0.1.0"
description = "A WSGI-compatible URL routing and view dispatching layer inspired by Django"
authors = [{name = "Django Framework", email = "django@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/example/djangoframework"
Repository = "https://github.com/example/djangoframework.git"
Issues = "https://github.com/example/djangoframework/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["djangoframework*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
