[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djangoframework"
version = "0.1.0"
description = "A Django-like WSGI framework implementation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Django Framework", email = "django@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/example/djangoframework"
Repository = "https://github.com/example/djangoframework.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["djangoframework*"]
