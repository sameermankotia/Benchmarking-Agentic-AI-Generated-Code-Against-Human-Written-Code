[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaskframework"
version = "0.1.0"
description = "A WSGI-compatible micro web framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Flask Framework", email = "dev@flaskframework.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/flaskframework/flaskframework"
Repository = "https://github.com/flaskframework/flaskframework.git"
Documentation = "https://flaskframework.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["flaskframework*"]
